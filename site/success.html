<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6ef"><meta name="referrer" content="no-referrer"><title>付款狀態確認中｜下班副業能力拆解</title>
<style>
:root{--paper:#f8f6ef;--white:#fffefa;--ink:#202923;--muted:#667169;--green:#315e4c;--line:#dfe4d9;--lime:#d9edaa;--serif:Georgia,"Noto Serif TC","Songti TC",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,620px);padding:clamp(28px,6vw,54px);border:1px solid var(--line);border-radius:28px;background:var(--white);box-shadow:0 22px 60px #273d2b14;text-align:center}.mark{margin:0 auto 22px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#edf2e5;color:var(--green);font-size:25px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--green)}h1{font:650 clamp(32px,7vw,46px)/1.2 var(--serif);margin:13px 0}p{color:var(--muted);line-height:1.8}.status{font-size:14px;color:var(--green);font-weight:700;margin:22px 0 0}.btn[hidden]{display:none}.btn{display:inline-flex;margin-top:22px;min-height:48px;padding:0 22px;align-items:center;justify-content:center;background:var(--green);color:white;border-radius:99px;text-decoration:none;font-weight:700}.foot{font-size:12px;margin-top:24px}
</style></head>
<body><main class="card"><div class="mark" aria-hidden="true">↗</div><div class="eyebrow">Order update</div><h1>正在確認付款狀態</h1><p>我們已收到結帳頁返回訊息，正在等待 Portaly 安全付款通知。請稍候片刻；此頁不會單憑瀏覽器返回訊息判定付款成功。</p><p class="status" id="status" role="status" aria-live="polite">正在查詢訂單…</p><a class="btn" id="download" hidden rel="noopener">下載工具包</a><a class="btn" href="./index.html">返回產品頁</a><p class="foot">若狀態未更新，請稍後查看結帳時使用的電子郵件，或聯絡產品支援。</p></main>
<script>
const API_BASE='https://YOUR_SUPABASE_PROJECT.supabase.co/functions/v1';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY';
const order=new URLSearchParams(location.search).get('order');const statusEl=document.getElementById('status');let timer;
async function refresh(){if(!order){statusEl.textContent='找不到訂單編號，請查看結帳通知信。';return}try{const response=await fetch(`${API_BASE}/get-order-status?order=${encodeURIComponent(order)}`,{headers:{apikey:SUPABASE_ANON_KEY}});const result=await response.json();if(!response.ok)throw new Error();if(result.status==='paid'){clearInterval(timer);if(result.downloadReady&&result.downloadUrl){statusEl.textContent='付款已確認，工具包已準備好。';const link=document.getElementById('download');link.href=result.downloadUrl;link.hidden=false}else{statusEl.textContent='付款已確認，下載檔案尚未完成設定。請聯絡產品支援。'}return}if(result.status==='test_paid'){clearInterval(timer);statusEl.textContent='測試付款已收到（不代表正式收款）。';return}if(result.status==='payment_failed'){clearInterval(timer);statusEl.textContent='這筆付款未完成；可返回結帳頁重新嘗試。';return}if(result.status==='refunded'){clearInterval(timer);statusEl.textContent='這筆訂單已退款。';return}statusEl.textContent='付款通知尚在處理，頁面會自動再查詢。'}catch{statusEl.textContent='暫時無法查詢，請稍後重新整理或查看結帳通知信。'}}
refresh();let attempts=0;timer=setInterval(()=>{attempts++;refresh();if(attempts>=24)clearInterval(timer)},2500);
</script></body></html>
