<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6ef"><title>尚未完成付款｜下班副業能力拆解</title><style>:root{--paper:#f8f6ef;--white:#fffefa;--ink:#202923;--muted:#667169;--green:#315e4c;--line:#dfe4d9;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;--serif:Georgia,"Noto Serif TC","Songti TC",serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100svh;display:grid;place-items:center;padding:24px}.card{width:min(100%,600px);padding:clamp(28px,6vw,54px);border:1px solid var(--line);border-radius:28px;background:var(--white);box-shadow:0 22px 60px #273d2b14;text-align:center}.mark{margin:0 auto 22px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#f4eee4;color:#a4724e;font-size:25px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#a4724e}h1{font:650 clamp(32px,7vw,46px)/1.2 var(--serif);margin:13px 0}p{color:var(--muted);line-height:1.8}.btn{display:inline-flex;margin-top:22px;min-height:48px;padding:0 22px;align-items:center;justify-content:center;background:var(--green);color:white;border-radius:99px;text-decoration:none;font-weight:700}</style></head><body><main class="card"><div class="mark" aria-hidden="true">↺</div><div class="eyebrow">Checkout paused</div><h1>這次沒有完成付款</h1><p>目前沒有收到付款完成通知。你可以回到商品頁重新開始；若已在 Portaly 完成扣款，請聯絡支援並提供訂單編號。</p><a class="btn" href="./index.html">返回商品頁</a></main></body></html>
